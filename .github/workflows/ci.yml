name: CI
on: [push, pull_request]
jobs:
  player:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/player } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Check release preparation
        run: python3 ../../scripts/prepare_web_release.py build/web --revision "$GITHUB_SHA"
