name: CI
on: [push, pull_request]
jobs:
  player:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/player } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: neuronova-web-root
          path: apps/player/build/web
          retention-days: 14
