name: CI
on: [push, pull_request]
jobs:
  player:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/player } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
